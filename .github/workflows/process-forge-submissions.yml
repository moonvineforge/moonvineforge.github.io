name: Process Forge submissions

on:
  workflow_dispatch:
  schedule:
    - cron: "21 * * * *"

permissions: {}

concurrency:
  group: process-forge-submissions
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger private Forge intake processor
        shell: bash
        env:
          FORGE_PROCESSOR_TOKEN: ${{ secrets.FORGE_PROCESSOR_TOKEN }}
          FORGE_PROCESSOR_URL: "https://script.google.com/macros/s/AKfycbwjPby49avdHa1EH5pgmzOPaTJHKxOTBOS70izRkenANfEWX8myI8uZJJ_qBFxe6RD6UQ/exec"

        run: |
          set -u

          if [ -z "${FORGE_PROCESSOR_TOKEN:-}" ]; then
            echo "::error title=Forge processor::GitHub secret FORGE_PROCESSOR_TOKEN is missing."
            exit 1
          fi

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          for attempt in 1 2 3; do
            echo "Forge processor attempt ${attempt}/3"
            : > "$response_file"

            if ! curl \
              --fail-with-body \
              --silent \
              --show-error \
              --location \
              --connect-timeout 10 \
              --max-time 60 \
              --header "Accept: application/json" \
              --data-urlencode "adminAction=process_new" \
              --data-urlencode "processorToken=${FORGE_PROCESSOR_TOKEN}" \
              "${FORGE_PROCESSOR_URL}" \
              --output "$response_file"
            then
              curl_status=$?

              echo "::warning title=Forge processor::Request failed on attempt ${attempt}."

              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 5))
                continue
              fi

              echo "::error title=Forge processor::Apps Script could not be reached after three attempts."
              exit "${curl_status:-1}"
            fi

            python3 - "$response_file" <<'PY'
          import json
          import sys
          from pathlib import Path

          response_path = Path(sys.argv[1])

          try:
              payload = json.loads(
                  response_path.read_text(encoding="utf-8")
              )
          except Exception as exc:
              print(
                  "::error title=Forge processor::"
                  f"Apps Script returned invalid JSON: {exc}"
              )
              raise SystemExit(2)

          code = str(payload.get("code") or "")
          message = str(payload.get("message") or "")

          if payload.get("ok") is True and code == "processor_complete":
              scanned = payload.get("scanned", 0)
              processed = payload.get("processed", 0)
              needs_review = payload.get("needsReview", 0)
              invalid = payload.get("invalid", 0)
              errors = payload.get("errors", 0)
              remaining = payload.get("remaining", 0)

              print(
                  "::notice title=Forge processor::"
                  f"Complete — scanned={scanned}, "
                  f"processed={processed}, "
                  f"needs_review={needs_review}, "
                  f"invalid={invalid}, "
                  f"errors={errors}, "
                  f"remaining={remaining}"
              )
              raise SystemExit(0)

          if code == "processor_busy":
              print(
                  "::warning title=Forge processor::"
                  "The submission sheet is currently busy. Retrying."
              )
              raise SystemExit(75)

          if code == "processor_error":
              print(
                  "::warning title=Forge processor::"
                  f"Temporary processor error: {message or code}"
              )
              raise SystemExit(76)

          print(
              "::error title=Forge processor::"
              f"{code or 'unknown_error'}: "
              f"{message or 'Unknown Forge processor failure.'}"
          )
          raise SystemExit(1)
          PY

            parser_status=$?

            if [ "$parser_status" -eq 0 ]; then
              exit 0
            fi

            if [ "$parser_status" -eq 75 ] || [ "$parser_status" -eq 76 ]; then
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 5))
                continue
              fi

              echo "::error title=Forge processor::Processor remained unavailable after three attempts."
              exit 1
            fi

            exit "$parser_status"
          done

          echo "::error title=Forge processor::Unexpected end of processor retry loop."
          exit 1
