<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moonvine Forge Studios</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #1d2240 0%, #090a12 55%, #030305 100%);
      color: #f5f0e8;
      font-family: Georgia, 'Times New Roman', serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    main {
      max-width: 720px;
    }

    .symbol {
      font-size: 4rem;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: clamp(2.4rem, 7vw, 5rem);
      margin: 0;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    p {
      font-size: 1.25rem;
      line-height: 1.6;
      color: #d8d0c4;
    }

    .tagline {
      margin-top: 1.5rem;
      font-style: italic;
    }

    .footer {
      margin-top: 3rem;
      font-size: 0.95rem;
      color: #a69b8e;
    }

    a {
      color: #f1d18a;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main>
    <div class="symbol">☾ ✦ ⚒</div>
    <h1>Moonvine Forge Studios</h1>
    <p class="tagline">Independent game studio crafting atmospheric worlds.</p>
    <p>First projects soon to be released.</p>

    <div class="footer">
      <a href="mailto:contact@moonvineforge.com">contact@moonvineforge.com</a>
      <br><br>
      Impressum and privacy policy coming soon.
    </div>
  </main>
</body>
</html>
